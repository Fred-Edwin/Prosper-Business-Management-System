name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (DB-free)
        run: pnpm test:unit

      - name: Build
        run: pnpm build
        env:
          # Build-time only: no route in this app touches the DB at build
          # time (App Router pages fetch at request time), but Prisma's
          # generated client needs DATABASE_URL to be defined to import
          # cleanly.
          DATABASE_URL: "postgresql://user:password@localhost:5432/prosper?schema=public"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXTAUTH_SECRET: "ci-build-placeholder-secret"
